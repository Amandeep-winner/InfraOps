[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "infraops"
version = "0.1.0"
description = "Infrastructure Monitoring & Incident Response Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "InfraOps Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "psutil>=5.9.8",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "jinja2>=3.1.3",
    "boto3>=1.34.0",
    "paramiko>=3.4.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.2.3",
    "rich>=13.7.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "moto[ec2,s3,iam,cloudwatch]>=5.0.0",
    "ruff>=0.3.0",
    "respx>=0.21.1",
]

[project.scripts]
infraops-server = "infraops.server.app:main"
infraops-agent = "infraops.agent.main:main"
infraops-sim = "scripts.simulate.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["infraops*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
